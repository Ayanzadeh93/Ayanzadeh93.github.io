name: Inject schema markup

on:
  workflow_dispatch:
  push:
    branches: [seo-schema-markup]
    paths:
      - 'scripts/inject_schema.py'
      - '.github/workflows/inject-schema.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-schema-markup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inject JSON-LD
        run: python scripts/inject_schema.py
      - name: Commit
        run: |
          git config user.name "Aydin Ayanzadeh"
          git config user.email "aydina1@umbc.edu"
          git add index.html blog.html projects/*.html apps/*.html scripts/inject_schema.py
          if git diff --cached --quiet; then
            echo "No schema changes"
          else
            git commit -m "seo: add JSON-LD schema and breadcrumbs"
            git push
          fi
