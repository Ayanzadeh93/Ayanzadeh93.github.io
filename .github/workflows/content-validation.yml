name: Validate portfolio content

on:
  pull_request:
    paths:
      - 'data/**'
      - 'projects/**'
      - 'skills/**'
      - 'apps/claude-code-catalog.html'
      - 'apps/claude-code-encyclopedia.html'
      - 'js/projects-index.js'
      - 'js/project-detail.js'
      - 'js/lib/project-data.js'
      - 'css/projects-data.css'
      - 'tests/**'
      - 'scripts/build_site.py'
      - 'assets/figures/**'
      - '*.html'
      - '*/index.html'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'css/**'
      - 'fonts/**'
      - 'assets/**'
      - 'blog/**'
      - '.github/workflows/content-validation.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'projects/**'
      - 'skills/**'
      - 'apps/claude-code-catalog.html'
      - 'apps/claude-code-encyclopedia.html'
      - 'js/**'
      - 'css/projects-data.css'
      - 'tests/**'
      - 'scripts/build_site.py'
      - 'assets/figures/**'
      - '*.html'
      - '*/index.html'
      - 'sitemap.xml'
      - 'llms.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project and skills data
        run: python tests/validate_content.py
      - name: Generated pages are up to date
        run: python scripts/build_site.py --check
      - name: Validate publication data and internal links
        run: |
          python tests/validate_publications.py --self-test
          python tests/validate_publications.py
      - name: Size budgets
        run: python tests/check_budgets.py
