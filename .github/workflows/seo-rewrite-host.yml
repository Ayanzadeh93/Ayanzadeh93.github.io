name: SEO rewrite canonical host

on:
  workflow_dispatch:
  push:
    branches: [seo-custom-domain]
    paths:
      - '.github/workflows/seo-rewrite-host.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seo-custom-domain
      - name: Rewrite github.io URLs and homepage snippets
        run: |
          set -euo pipefail
          git config user.name "Aydin Ayanzadeh"
          git config user.email "aydina1@umbc.edu"
          find . -type f \( -name '*.html' -o -name '*.xml' -o -name '*.txt' -o -name '*.md' -o -name '*.json' \) \
            ! -path './.git/*' -print0 | xargs -0 sed -i \
            -e 's#https://ayanzadeh93.github.io#https://www.ayanzadeh.com#g' \
            -e 's#http://ayanzadeh93.github.io#https://www.ayanzadeh.com#g'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              'Aydin Ayanzadeh - PhD Student | Computer Vision & Medical AI Researcher | UMBC',
              'Aydin Ayanzadeh | Computer Vision & Medical AI, UMBC',
          )
          t = t.replace(
              'Aydin Ayanzadeh - PhD Student | Computer Vision & Medical AI Researcher',
              'Aydin Ayanzadeh | Computer Vision & Medical AI, UMBC',
          )
          t = t.replace(
              'Aydin Ayanzadeh - Ph.D. Student in Computer Science at UMBC (M.S. 2025). Specializing in Computer Vision, Medical Image Analysis, Multimodal Learning, and Vision-Language Models. Published researcher in AI and deep learning with expertise in accessibility technologies.',
              'Ph.D. student at UMBC working on computer vision, medical imaging, and multimodal models. Publications, projects, and CV.',
          )
          p.write_text(t, encoding='utf-8')
          PY
          git add -A
          if git diff --cached --quiet; then
            echo "No URL changes left"
          else
            git commit -m "seo: point remaining pages at www.ayanzadeh.com"
            git push
          fi
